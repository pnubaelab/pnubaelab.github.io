name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "_plugins/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.cjs"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "rust/**"
      - "bin/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "_plugins/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.cjs"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "rust/**"
      - "bin/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  # Commits created by Update Data Files use GITHUB_TOKEN, whose pushes do not
  # trigger another workflow. Build the updated default branch after it succeeds.
  workflow_run:
    workflows: ["Update Data Files"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # The data update commit is newer than workflow_run.head_sha.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || '' }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate count-up animation
        run: node utils/validate_count_up.cjs
      - name: Validate research vectors
        run: node utils/validate_research_vectors.cjs
      - name: Validate browser loading behavior
        run: node utils/validate_optional_libraries.cjs
      - name: Validate photo gallery scheduling
        run: node utils/validate_photo_gallery.cjs
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test Rust optimizer
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Restore generated asset cache
        uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: site-assets-v1-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'rust/Cargo.lock', 'rust/src/**', '_plugins/*cache*.rb', 'bin/asset_cache.rb') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            site-assets-v1-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'rust/Cargo.lock', 'rust/src/**', '_plugins/*cache*.rb', 'bin/asset_cache.rb') }}-
      - name: Validate original photo dimensions
        run: bundle exec ruby utils/validate_photo_dimensions.rb
      - name: Validate Scholar timeout handling
        run: bundle exec ruby utils/validate_scholar_timeouts.rb
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build --profile
      - name: Validate asset cache invalidation
        run: bundle exec ruby utils/validate_asset_cache.rb
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Optimize images with Rust
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml
          ruby bin/asset_cache.rb _site/assets rust/target/release/site-optimize .jekyll-cache
      - name: Validate built graph CSS
        run: node utils/validate_collabo_css.cjs
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
