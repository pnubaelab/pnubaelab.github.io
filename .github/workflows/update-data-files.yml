name: Update Data Files

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml scholarly requests beautifulsoup4 bibtexparser numpy
      
      - name: Generate publication count
        run: python generate_pub_count.py
      
      - name: Generate collaboration graph
        run: python generate_collabo_graph.py
      
      - name: Generate keyword similarity
        run: python generate_keyword_similarity.py
      
      - name: Fetch Google Scholar citations
        run: python generate_scholar_citations.py
        env:
          SCHOLARLY_USE_PROXY: 'false'
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _data/pub_count.yml _data/scholar_citations.yml assets/json/collabo_graph.json assets/json/keyword_similarity.json
          git commit -m "chore: update data files [skip ci]"
          git push
